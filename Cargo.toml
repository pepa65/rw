[package]
name = "rwh"
version = "0.13.4"
authors = ["Fina Wilke <code@felinira.net>", "piegames <info@piegames.de>", "Brian Warner <warner@lothar.com>", "github.com/pepa65"]
description = "Safe filetransfer through magic-wormhole"
keywords = ["magic-wormhole", "wormhole", "file-transfer", "transfer"]
categories = ["network-programming", "asynchronous", "command-line-utilities"]
readme = "README.md"
homepage = "http://magic-wormhole.io/"
repository = "https://github.com/pepa65/rwh"
documentation = "https://docs.rs/rwh"
license = "EUPL-1.2"
rust-version = "1.97"
edition = "2024"

[lib]
name = "rwh"
path = "src/lib.rs"

[[bin]]
name = "rwh"
path = "src/bin/rwh/main.rs"

[package.metadata.docs.rs]
all-features = true

[package.metadata.binstall]
pkg-url = "{repo}/releases/download/{version}/rwh.tgz"
pkg-fmt = "Tgz"
disabled-strategies = ["quick-install", "compile"]
target-family = "Linux"
target-arch = "X86_64"

[dependencies]
# Library
serde = { version = "1.0.120", features = ["rc"] }
serde_json = "1.0.61"
serde_derive = "1.0.120"
crypto_secretbox = "0.1.1"
spake2 = "0.4"
sha1 = "0.11"
sha2 = "0.11"
hkdf = "0.13"
hex = { version = "0.4.2", features = ["serde"] }
rand = "0.10.2"
base64 = "0.23.1"
time = { version = "0.3.47", features = ["formatting"] }
futures-lite = "2.6"
futures-concurrency = "7.7.1"
derive_more = { version = "2", default-features = false, features = ["display", "deref", "from"] }
thiserror = "2"
futures = "0.3.12"
url = { version = "2.2.2", features = ["serde"] }
percent-encoding = "2.1.0"
zxcvbn = "3.1.0"
tracing = { version = "0.1", features = ["log"] }

# Transit
stun_codec = { version = "0.4.0", optional = true }
bytecodec = { version = "0.5", optional = true }
noise-rust-crypto = { version = "0.6.0-rc.1", optional = true }
async-trait = { version = "0.1", optional = true }
noise-protocol = { version = "0.2", optional = true }
async-task = "4.7"

# Transfer
rmp-serde = { version = "1.0.0", optional = true }
tar = { version = "0.4.45", optional = true }

# Experimental
fuzzt = { version = "0.3.1", optional = true }

# CLI
async-channel = "2.5"
smol = "2.0"
clap = { version = "4", features = ["cargo", "derive", "help", "env"] }
clap_complete = "4"
env_logger = "0.11"
console = "0.16"
indicatif = "0.18"
dialoguer = { version = "0.12", features = ["completion"] }
color-eyre = "0.6"
unit-prefix = "0.5"
ctrlc = "3.2.1"
qr2term = "0.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Clipboard
arboard = { version = "3", default-features = false, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc = "0.2.101"
async-executor = "1.13"
async-process = { version = "2.5.0", optional = true }
async-tungstenite = { version = "0.35", features = ["smol-runtime"] }
async-io = "2.2"
async-net = "2.0"
async-fs = "2.0"

# Transit
socket2 = { version = "0.6", optional = true, features = ["all"] }
if-addrs = { version = "0.15", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
ws_stream_wasm = "0.7.3"
getrandom = "0.4"
wasmtimer = "0.4"

[dev-dependencies]
test-log = { version = "0.2", features = ["trace"] }
eyre = "0.6.14"
async-process = "2.5"
macro_rules_attr = "0.2"
trycmd = "1.2"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]

# Library functionality
transfer = ["transit", "dep:tar", "dep:rmp-serde"]
transit = ["dep:noise-rust-crypto", "dep:noise-protocol", "dep:socket2", "dep:stun_codec", "dep:if-addrs", "dep:bytecodec", "dep:async-trait"]
forwarding = ["transit", "dep:rmp-serde", "dep:async-process"]

# CLI functionality
clipboard = ["dep:arboard"]

# TLS implementations for websocket connections via async-tungstenite
futures-rustls-manual-roots = ["async-tungstenite/futures-rustls-manual-roots"]
futures-rustls-native-certs = ["async-tungstenite/futures-rustls-native-certs"]
futures-rustls-platform-verifier = ["async-tungstenite/futures-rustls-platform-verifier"]
futures-rustls-webpki-roots = ["async-tungstenite/futures-rustls-webpki-roots"]

# Everything normally needed by the CLI
default = ["transit", "transfer", "forwarding", "futures-rustls-native-certs"]
all = ["default", "clipboard", "fuzzy-complete"]

# Experimental transfer-v2 support.
experimental-transfer-v2 = []
experimental = ["experimental-transfer-v2"]

fuzzy-complete = ["fuzzt"]

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
strip = true
